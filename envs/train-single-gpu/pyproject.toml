[project]
name = "duo-vla-train-single-gpu"
version = "0.1.0"
description = "Pinned Blackwell-compatible single-GPU training runtime for Duo-VLA"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.14.0",
    "huggingface-hub==1.29.0",
    "numpy==2.4.6",
    "peft==0.20.0",
    "pillow==12.3.0",
    "pyarrow==20.0.0",
    "pytest==8.4.2",
    "ruff==0.16.5",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.15.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
