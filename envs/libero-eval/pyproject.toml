[project]
name = "duo-vla-libero-eval"
version = "0.1.0"
description = "Isolated, pinned LIBERO evaluation runtime for Duo-VLA"
requires-python = "==3.12.*"
dependencies = [
    "cmake==4.1.3",
    "hf-egl-probe==1.0.2",
    "hf-libero==0.1.4",
    "huggingface-hub==1.29.0",
    "mujoco==3.8.1",
    "numpy==2.2.6",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
egl-probe = ["cmake==4.1.3"]
hf-egl-probe = ["cmake==4.1.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
